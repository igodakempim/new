<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>התחברות למערכת</title>

<link rel="icon" href="logo.png" type="image/png">

<style>

:root{
    --primary:#004a99;
    --secondary:#007bff;
}

*{
    box-sizing:border-box;
}

body{
    background:linear-gradient(135deg,#eef2f7 0%,#dbe7f2 100%);
    font-family:'Segoe UI',sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    overflow:hidden;
}

/* רקע זז */
body::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:rgba(0,123,255,.08);
    border-radius:50%;
    top:-200px;
    left:-150px;
    animation:float 8s infinite ease-in-out;
}

body::after{
    content:"";
    position:absolute;
    width:400px;
    height:400px;
    background:rgba(0,74,153,.08);
    border-radius:50%;
    bottom:-150px;
    right:-120px;
    animation:float 10s infinite ease-in-out;
}

@keyframes float{
    50%{
        transform:translateY(30px);
    }
}

.card{
    position:relative;
    z-index:5;
    background:white;
    padding:40px;
    border-radius:30px;
    box-shadow:0 20px 40px rgba(0,0,0,.15);
    width:380px;
    text-align:center;
    animation:fadeIn .8s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.logo{
    width:120px;
    margin-bottom:20px;
    animation:pulse 3s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.05);
    }
}

h2{
    color:var(--primary);
    margin-bottom:25px;
}

input{
    width:100%;
    padding:15px;
    margin:10px 0;
    border:2px solid #e1e8ed;
    border-radius:15px;
    transition:.3s;
    font-size:15px;
}

input:focus{
    border-color:var(--secondary);
    outline:none;
    transform:scale(1.02);
}

button{
    background:var(--primary);
    color:white;
    border:none;
    padding:15px;
    width:100%;
    border-radius:15px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition:.3s;
    margin-top:10px;
}

button:hover{
    background:var(--secondary);
    transform:translateY(-3px);
}

#msg{
    margin-top:20px;
    min-height:25px;
    font-weight:bold;
}

.error{
    color:red;
    animation:blink .6s infinite;
}

.success{
    color:green;
}

@keyframes blink{
    50%{
        opacity:.3;
    }
}

/* חלון החלפת סיסמה */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.modal-content{
    background:white;
    width:400px;
    max-width:90%;
    padding:30px;
    border-radius:25px;
    text-align:center;
    animation:popup .3s ease;
}

@keyframes popup{
    from{
        transform:scale(.8);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.modal-content h3{
    color:var(--primary);
}

.modal-content input{
    margin-top:15px;
}

/* בועת צ'אט */

.chat-btn{
    position:fixed;
    right:25px;
    bottom:25px;
    width:65px;
    height:65px;
    border-radius:50%;
    background:#007bff;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    cursor:pointer;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    z-index:999;
    transition:.3s;
    animation:bounce 2s infinite;
}

.chat-btn:hover{
    transform:scale(1.1);
}

@keyframes bounce{
    50%{
        transform:translateY(-8px);
    }
}

</style>

<script>
if(localStorage.getItem('isLoggedIn')==='true'){
    window.location.href='index.html';
}
</script>

</head>
<body>

<div class="card">

    <img src="logo.png" class="logo">

    <h2>כניסת משתמשים</h2>

    <input type="email" id="email" placeholder="אימייל">

    <input type="password" id="pass" placeholder="סיסמה">

    <button onclick="handleLogin()">
        התחבר למערכת
    </button>

    <p id="msg"></p>

</div>

<!-- חלון הגדרת סיסמה -->

<div class="modal" id="passwordModal">

    <div class="modal-content">

        <h3>הגדרת סיסמה חדשה</h3>

        <p>זוהי הכניסה הראשונה שלך למערכת</p>

        <input
            type="password"
            id="newPassword"
            placeholder="סיסמה חדשה"
        >

        <button onclick="saveFirstPassword()">
            שמור והמשך
        </button>

    </div>

</div>

<!-- בועת צ'אט -->

<div class="chat-btn" onclick="window.location.href='contact.html'">
💬
</div>

<script>

const SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbyaOWO52njqEt2J4ZazUHLuym6sxIs8cNn8k3fY8IF0Kj2tiRP53bA4kftAbVPVxGBgcw/exec';

let firstTimeEmail = '';

document.addEventListener('keydown', function(e){

    if(e.key === 'Enter'){
        const modal =
        document.getElementById('passwordModal');

        if(modal.style.display === 'flex'){
            saveFirstPassword();
        }else{
            handleLogin();
        }
    }
});

function showError(text){

    const msg =
    document.getElementById('msg');

    msg.className = 'error';
    msg.innerText = text;
}

function showSuccess(text){

    const msg =
    document.getElementById('msg');

    msg.className = 'success';
    msg.innerText = text;
}

async function handleLogin(){

    const email =
    document.getElementById('email').value.trim();

    const password =
    document.getElementById('pass').value;

    showSuccess('מתחבר...');

    try{

        const res = await fetch(
            SCRIPT_URL,
            {
                method:'POST',
                headers:{
                    'Content-Type':'text/plain;charset=utf-8'
                },
                body:JSON.stringify({
                    email,
                    password,
                    action:'login'
                })
            }
        );

        const data = await res.json();

        if(data.status === 'SUCCESS'){

            localStorage.setItem(
                'isLoggedIn',
                'true'
            );

            localStorage.setItem(
                'userEmail',
                email
            );

            showSuccess(
                'התחברות הצליחה'
            );

            setTimeout(()=>{
                window.location.href =
                'index.html';
            },700);

        }

        else if(
            data.status === 'FIRST_TIME'
        ){

            firstTimeEmail = email;

            document
            .getElementById(
                'passwordModal'
            )
            .style.display='flex';

        }

        else{

            showError(
                data.message ||
                'המייל או הסיסמה שגויים'
            );

        }

    }catch(err){

        console.error(err);

        showError(
            'שגיאה בחיבור לשרת'
        );

    }
}

async function saveFirstPassword(){

    const newPass =
    document.getElementById(
        'newPassword'
    ).value;

    if(!newPass){
        return;
    }

    const res = await fetch(
        SCRIPT_URL,
        {
            method:'POST',
            headers:{
                'Content-Type':
                'text/plain;charset=utf-8'
            },
            body:JSON.stringify({
                email:firstTimeEmail,
                password:newPass,
                action:'update'
            })
        }
    );

    const data = await res.json();

    if(
        data.status === 'SUCCESS' ||
        data.success
    ){

        localStorage.setItem(
            'isLoggedIn',
            'true'
        );

        localStorage.setItem(
            'userEmail',
            firstTimeEmail
        );

        showSuccess(
            'הסיסמה נשמרה בהצלחה'
        );

        setTimeout(()=>{
            window.location.href =
            'index.html';
        },700);

    }else{

        showError(
            data.message ||
            'שגיאה בשמירת הסיסמה'
        );

    }
}

</script>

</body>
</html>
