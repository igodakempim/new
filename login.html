<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>התחברות למערכת</title>
  <!-- Favicon - הלוגו שיופיע בלשונית הדפדפן -->
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    :root {
      --primary: #004a99;
      --secondary: #007bff;
      --bg: #eef2f7;
    }

    body {
      background: linear-gradient(135deg, #eef2f7 0%, #dbe7f2 100%);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      width: 350px;
      text-align: center;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo { width: 120px; margin-bottom: 20px; }

    h2 { color: var(--primary); margin-bottom: 25px; }

    input {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: 2px solid #e1e8ed;
      border-radius: 15px;
      box-sizing: border-box;
      transition: 0.3s;
    }

    input:focus { border-color: var(--secondary); outline: none; }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 15px;
      width: 100%;
      border-radius: 15px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: 0.3s;
      margin-top: 10px;
    }

    button:hover { background: var(--secondary); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

    #msg { margin-top: 20px; font-size: 14px; color: #555; }
  </style>

  <script>
    // בדיקה: אם המשתמש כבר מחובר, העבר אותו ישירות לדף הראשי
    if (localStorage.getItem('isLoggedIn') === 'true') {
      window.location.href = "index.html";
    }
  </script>
</head>
<body>

<div class="card">
  <!-- הכנס כאן את הלוגו שלך -->
  <img src="logo.png" alt="Logo" class="logo">
  
  <h2>כניסת משתמשים</h2>
  <input type="email" id="email" placeholder="אימייל">
  <input type="password" id="pass" placeholder="סיסמה">
  <button onclick="handleLogin()">התחבר למערכת</button>
  <p id="msg"></p>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyl17f92AztVCMzBg9wAepxVJXpwkUQLw4FMz8HCop62jDJRrUkeE_yjo03cccBc7Zdcg/exec';

  async function handleLogin() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('pass').value;
    const msg = document.getElementById('msg');
    
    msg.innerText = "מתחבר...";

    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'cors',
        body: JSON.stringify({ email, password, action: 'login' })
      });
      
      const data = await res.json();
      
      if (data.status === 'SUCCESS') {
        localStorage.setItem('isLoggedIn', 'true'); // שמירת מצב חיבור
        msg.innerText = "התחברות הצליחה, מעביר אותך...";
        setTimeout(() => { window.location.href = "index.html"; }, 1000);
      } else if (data.status === 'FIRST_TIME') {
        const newPass = prompt("זהו חיבור ראשון. נא להגדיר סיסמה חדשה:");
        if (newPass) updatePassword(email, newPass);
      } else {
        msg.innerText = data.message;
      }
    } catch (error) {
      msg.innerText = "שגיאה בחיבור לשרת.";
    }
  }

  async function updatePassword(email, newPass) {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'cors',
      body: JSON.stringify({ email, password: newPass, action: 'update' })
    });
    const data = await res.json();
    document.getElementById('msg').innerText = data.message;
  }
</script>
</body>
</html>
